arches:
  - x86_64
  - aarch64
  - ppc64le
contentOrigin:
  repofiles:
    - repos.d/ubi.repo
    - repos.d/copr-galileo-bazel-epel-9.repo
  # NOTE: the *-source-rpms sections are intentionally absent from ubi.repo.
  # SRPMs roughly quadruple the prefetch artifact size, which OOMs the
  # prefetch-dependencies task (3Gi limit) when pushing the trusted artifact.
  # Sources for all these packages remain publicly available from
  # cdn-ubi.redhat.com and download.copr.fedorainfracloud.org.
packages:
  - bazel6
  - ca-certificates
  - clang
  - cmake
  - findutils
  - gcc
  - git
  - libcurl-devel
  - make
  - openssl-devel
  - patch
  - python3
  - tzdata
  # NOTE: tzdata is installed in the context image, so rpm-lockfile-prototype
  # excludes it from the generated lockfile. After regenerating rpms.lock.yaml,
  # re-append the tzdata entries (packages + source, all three arches) manually.
  - unzip
  - which
context:
  # The builder-stage base image; the final-stage ubi-minimal-pqc image requires
  # registry.redhat.io authentication and cannot be resolved anonymously.
  image: registry.access.redhat.com/ubi9/ubi@sha256:16e9e43d99e181463513cc84a514859b1abb9460f1c4d9e208da4b4e51cd5cc3
